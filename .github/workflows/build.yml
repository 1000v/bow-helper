name: Build Fabric 1.16.5 Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build mod with Gradle
        run: gradle build --stacktrace

      - name: Upload compiled JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: BowHitboxHelper-1.16.5
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
